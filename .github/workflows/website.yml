name: Prüfen und veröffentlichen

# Bei jedem Push und Pull Request: Prüfungen (npm test).
# Bei Push auf master: danach den Ordner site/ auf GitHub Pages veröffentlichen –
# aber nur, wenn alle Prüfungen bestanden sind.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Fertiges Playwright-Paket mit Browser und Systembibliotheken: spart die
    # Installation bei jedem Lauf (die dauerte je nach Paketquelle bis zu 8 Minuten).
    # Version muss zu "playwright" in package.json passen.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
