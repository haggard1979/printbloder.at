<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Vorschaubild</title>
    <style>
        /* Quelle für site/img/vorschau.jpg (1200 × 630) – erzeugen mit "npm run vorschau" */
        * { box-sizing: border-box; margin: 0; }
        body {
            width: 1200px; height: 630px; overflow: hidden;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #1a4fa8 0%, #123a7d 100%);
            display: flex; align-items: center; padding: 0 84px; gap: 56px;
        }
        .text { flex: 1; min-width: 0; }
        .brand { font-size: 64px; font-weight: 800; letter-spacing: .04em; line-height: 1; }
        .rule { width: 96px; height: 8px; border-radius: 4px; background: #f2a33a; margin: 30px 0; }
        .claim { font-size: 40px; font-weight: 600; line-height: 1.25; }
        .place { margin-top: 24px; font-size: 28px; color: #c9daf5; line-height: 1.35; }
        .tiles { display: grid; grid-template-columns: repeat(2, 200px); gap: 20px; flex: none; }
        .tiles div { width: 200px; height: 107px; border-radius: 18px; overflow: hidden; background: #eef5fc; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); }
        .tiles img { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <div class="text">
        <div class="brand">PRINTBLODER</div>
        <div class="rule"></div>
        <div class="claim">Copy- &amp; Printshop</div>
        <div class="place">Shopping City Seiersberg<br>bei Graz</div>
    </div>
    <div class="tiles">
        <div><img src="../site/img/icons/stempel.svg" alt=""></div>
        <div><img src="../site/img/icons/visitkarten.svg" alt=""></div>
        <div><img src="../site/img/icons/textildruck.svg" alt=""></div>
        <div><img src="../site/img/icons/digitaldruck.svg" alt=""></div>
        <div><img src="../site/img/icons/plakate.svg" alt=""></div>
        <div><img src="../site/img/icons/geschenke.svg" alt=""></div>
    </div>
</body>
</html>
